name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A82199: ${{ secrets.A82199 }}
          BA114C: ${{ secrets.BA114C }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A82199', '')
          env_b = os.environ.get('BA114C', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 25082c5cd9e96f036652cc2acaf7d9c2e94a71f1 -->', env_a)
          if env_b:
              result = result.replace('<!-- 9abe11947e3e3fa8e08851a497ab8ed3c15d636962 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
